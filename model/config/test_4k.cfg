// 4K (3840x2160) 8bpc 12bpp 多 slice 用例。
// 每行 4 个 slice（960 宽），纵向 20 个 slice row（108 高）= 80 slices per frame。
// 输入图由 tools/generate_test_images.py --width 3840 --height 2160 生成到 testdata4k/。
// 运行方式（cwd = model/config）：../src/dsc -F test_4k.cfg
DSC_VERSION_MINOR	2

FUNCTION  1   // 1=encode only（写 .dsc bitstream）
               // 改 2 可对已生成 .dsc 回读解码校验

SRC_LIST		test_list_4k.txt

OUT_DIR		../testdata4k

// 4K: 每行 4 slice（960×4=3840），slice height 108（108×20=2160）。
SLICE_WIDTH    960
SLICE_HEIGHT   108

BLOCK_PRED_ENABLE    1
VBR_ENABLE     0
LINE_BUFFER_BPC    16

USE_YUV_INPUT  0
SIMPLE_422     0
NATIVE_422     0
NATIVE_420     0

FULL_ICH_ERR_PRECISION	0

INCLUDE    rc_8bpc_12bpp.cfg